- type: entity
  parent: BaseItem
  id: SpaceCash
  name: spesos
  abstract: true
  description: You gotta have money.
  components:
  - type: Cash
  - type: Tag
    tags:
    - Cash
  - type: Item
    shape:
    - 0,0,1,0
    storedOffset: 0,-2
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        density: 30
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.2,0.25,0.1"
        mask:
        - ItemMask
  - type: Appearance

- type: entity
  parent: SpaceCash
  id: SpaceCash1
  name: 'speso bill [$1]'
  components:
